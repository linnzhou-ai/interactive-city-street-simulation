name: Deploy branch websites

on:
  push:
    branches:
      - main
      - linn
      - albert
      - chanyoung
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          path: source-main

      - name: Check out linn
        uses: actions/checkout@v6
        with:
          ref: linn
          path: source-linn

      - name: Check out albert
        uses: actions/checkout@v6
        with:
          ref: albert
          path: source-albert

      - name: Check out chanyoung
        uses: actions/checkout@v6
        with:
          ref: chanyoung
          path: source-chanyoung

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source-main/pnpm-lock.yaml

      - name: Build all branch websites
        shell: bash
        run: |
          mkdir -p publish

          build_branch() {
            local branch="$1"
            local destination="$2"

            pushd "source-${branch}"
            pnpm install --frozen-lockfile
            pnpm exec tsc
            pnpm exec vite build --outDir "${GITHUB_WORKSPACE}/${destination}" --emptyOutDir
            popd
          }

          build_branch main publish
          build_branch linn publish/linn
          build_branch albert publish/albert
          build_branch chanyoung publish/chanyoung
          touch publish/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
